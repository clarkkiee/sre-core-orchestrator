# Reference: Base Kind cluster config structure.
# This file is NOT loaded at runtime — KindConfigBuilder generates configs
# programmatically with dynamic port allocation and configurable worker count.
#
# Shown here for documentation purposes.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: "<cluster-name>"
networking:
  apiServerPort: 0  # Dynamically allocated from port block
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 0      # Dynamically allocated
    protocol: TCP
  - containerPort: 443
    hostPort: 0      # Dynamically allocated
    protocol: TCP
  - containerPort: 30080
    hostPort: 0      # Dynamically allocated
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 30443
    hostPort: 0      # Dynamically allocated
    listenAddress: "0.0.0.0"
    protocol: TCP
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "master=true"
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "worker=true"
# containerdConfigPatches are included only if PRIVATE_REGISTRY_URL is set
