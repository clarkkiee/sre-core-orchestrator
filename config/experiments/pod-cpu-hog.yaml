args: "./experiments -name pod-cpu-hog"
needs_runtime_socket: true
env:
  TOTAL_CHAOS_DURATION: "120"
  CPU_CORES: "0"
  CPU_LOAD: "100"
  PODS_AFFECTED_PERC: "100"
  SEQUENCE: "parallel"
  CONTAINER_RUNTIME: "containerd"
  SOCKET_PATH: "/run/k3s/containerd/containerd.sock"
  RAMP_TIME: "0"