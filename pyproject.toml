[project]
name = "chaos-platform-core"
version = "1.0.0"
description = "Chaos Engineering Reliability Testing Platform - Backend API & Pipeline"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["chaos-engineering", "reliability-testing", "kubernetes", "sre"]

classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core dependencies
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Validation & Settings
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.17",  # PostgreSQL driver (sync)
    "asyncpg>=0.29.0",  # PostgreSQL async driver

    # Authentication
    "bcrypt>=4.1.2",  # Password hashing

    # Kubernetes
    "kubernetes>=29.0.0",
    "kubernetes-asyncio>=29.0.0",  # Async support

    # Monitoring & Metrics
#    "prometheus-api-client>=0.5.4",
#    "prometheus-client>=0.19.0",

    # Load Testing
#    "locust>=2.20.0",

    # Data Processing
    "pandas>=2.2.0",
    "numpy>=1.26.3",

    # Utilities
    "gitpython>=3.1.41",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "click>=8.1.7",  # CLI tools

    # Templating & Reporting
    "jinja2>=3.1.3",
    "reportlab>=4.0.9",
    "matplotlib>=3.8.2",

    # HTTP Client
    "httpx>=0.26.0",  # Modern async HTTP client

    # Task Queue
    "celery>=5.3.6",  # Distributed task queue
]

[project.optional-dependencies]
# Development dependencies
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",  # Parallel testing
    "faker>=22.0.0",  # Test data generation

    # Code Quality
    "ruff>=0.1.14",  # Fast linter (replaces flake8, isort, black)
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",

    # Type stubs
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
    "sqlalchemy[mypy]>=2.0.25",

    # Debugging
    "ipython>=8.20.0",
    "ipdb>=0.13.13",

    # Documentation
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.6",
]

# Production extras
prod = [
    "gunicorn>=21.2.0",  # Production WSGI server
    "sentry-sdk[fastapi]>=1.40.0",  # Error tracking
]

[project.scripts]
# CLI commands
chaos-api = "app.cli:main"

#[project.urls]
#Homepage = "https://github.com/yourusername/chaos-platform-backend"
#Documentation = "https://docs.chaos-platform.dev"
#Repository = "https://github.com/yourusername/chaos-platform-backend"
#Issues = "https://github.com/yourusername/chaos-platform-backend/issues"

# =============================================================================
# Build System (using modern build backend)
# =============================================================================
[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

# =============================================================================
# Ruff - Modern, fast Python linter (replaces black, isort, flake8)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # Ruff-specific rules
]

ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "ARG",     # Unused arguments
    "PLR2004", # Magic value comparison
]
"alembic/versions/*.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MyPy - Static type checker
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "kubernetes.*",
    "prometheus_api_client.*",
    "locust.*",
    "reportlab.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest - Testing framework
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov=pipeline",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "--tb=short",
    "--maxfail=1",
    "-n=auto",  # Parallel testing with xdist
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "kubernetes: Tests requiring Kubernetes cluster",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["app", "pipeline"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
    "*/venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

# =============================================================================
# Alembic - Database migrations
# =============================================================================
[tool.alembic]
script_location = "alembic"
